            } else {
                state.cart.push({ productId, qty });
            }
            saveCart();
            showToast('Item added to your shopping cart!');
            state.cartOpen = true;
            render();

        function updateCartQty(productId, delta) {
            const item = state.cart.find(i => i.productId === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    state.cart = state.cart.filter(i => i.productId !== productId);
                }
            }
            saveCart();
            render();
        }

        function removeFromCart(productId) {
            state.cart = state.cart.filter(i => i.productId !== productId);

        }

        function getCartDetails() {
            let items = [];
            let subtotal = 0;
            state.cart.forEach(c => {
                const p = state.products.find(prod => prod.id === c.productId);
                if (p) {
                    const itemTotal = p.salePrice * c.qty;
                    subtotal += itemTotal;
                    items.push({ ...p, qty: c.qty, itemTotal });
                }
            });
            const shipping = items.length > 0 ? 250 : 0;
            const total = subtotal + shipping;
            return { items, subtotal, shipping, total, count: items.reduce((acc, i) => acc + i.qty, 0) };
        }

        // Handle & Compress Uploaded Image File via HTML5 Canvas
        function processImageFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('Please select a valid image file!', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800; // Resize to max 800px width/height for fast loading & local storage saving
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height = Math.round((height * MAX_SIZE) / width);
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width = Math.round((width * MAX_SIZE) / height);
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to JPEG format with 0.8 quality
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    state.newProductImageBase64 = compressedBase64;
                    render();
                    showToast('Product image uploaded & compressed successfully!');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                                    ` : `
                                        <div onclick="document.getElementById('new-prod-file-input').click()" 
                                             ondragover="event.preventDefault(); this.classList.add('border-brand-yellow', 'bg-yellow-50')" 
                                             ondragleave="this.classList.remove('border-brand-yellow', 'bg-yellow-50')" 
                                             ondrop="event.preventDefault(); this.classList.remove('border-brand-yellow', 'bg-yellow-50'); if(event.dataTransfer.files[0]) processImageFile(event.dataTransfer.files[0]);" 
                                             class="mt-1 border-2 border-dashed border-gray-300 hover:border-black bg-gray-50 hover:bg-gray-100 rounded-2xl p-6 text-center cursor-pointer transition">
                                            
                                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                                            <p class="text-xs font-black text-black uppercase">Click or Drag & Drop Image Here</p>
                                            <p class="text-[10px] text-gray-500 font-bold mt-1">Supports PNG, JPG, WEBP (Auto-optimized)</p>
                                            
                                            <input id="new-prod-file-input" type="file" accept="image/*" class="hidden" onchange="if(this.files[0]) processImageFile(this.files[0])">
                                        </div>
                                    `}
                                </div>

                                <div>
                                    <label class="text-xs font-black text-gray-700 uppercase">Description</label>
                                    <textarea id="new-prod-desc" rows="3" placeholder="High performance product features..." required class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:border-black focus:outline-none mt-1"></textarea>
                                </div>

                                <button type="submit" class="w-full bg-brand-yellow text-black border-2 border-black py-4 rounded-xl font-black text-sm uppercase shadow-md hover:bg-yellow-400 transition">
                                    Add Product to Catalog
                                </button>
                            </form>
                        </div>

                        <!-- Live Product List -->
                        <div class="lg:col-span-7 space-y-4">
                            <h3 class="text-xl font-black italic uppercase text-black">Current Store Products (${state.products.length})</h3>

                            <div class="space-y-3">
                                ${state.products.map(p => `
                                    <div class="bg-white p-4 rounded-2xl border border-gray-200 flex items-center justify-between gap-4 shadow-sm">
                                        <img src="${p.image}" alt="${p.title}" class="w-16 h-16 object-contain rounded-xl border border-gray-200 bg-gray-50">
                                        
                                        <div class="flex-1">
                                            <h5 class="font-black text-sm text-black leading-snug">${p.title}</h5>
                                            <div class="text-xs font-bold text-gray-500 mt-1">Rs.${p.salePrice.toLocaleString()} PKR &nbsp;•&nbsp; Category: ${p.category}</div>
                                        </div>

                                        <button onclick="deleteProduct('${p.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 p-3 rounded-xl text-xs font-bold">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                    </div>
                    `}

                </div>
            </div>
            `;
        }

        // Order Slip Modal for Printing
        function renderOrderSlipModal() {
            const o = state.viewingOrderDetails;
            if (!o) return '';

            return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                <div class="bg-white rounded-3xl max-w-md w-full p-8 border-4 border-black shadow-2xl space-y-6">
                    <div class="flex justify-between items-center border-b-2 border-black pb-4">
                        <div>
                            <div class="font-black text-xl tracking-tight text-black">AAS MART</div>
                            <div class="text-[10px] font-bold text-gray-500 uppercase">Shipping & COD Label</div>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-sm text-black">${o.id}</div>
                            <div class="text-[10px] font-bold text-gray-500">${o.date}</div>
                        </div>
                    </div>

                    <div class="space-y-3 text-xs font-semibold text-gray-800">
                        <div class="bg-gray-100 p-3 rounded-xl">
                            <div class="font-black text-black text-sm">RECIPIENT DETAILS:</div>
                            <div>Name: <strong>${o.customerName}</strong></div>
                            <div>Phone: <strong>${o.phone}</strong></div>
                            <div>Address: <strong>${o.address}, ${o.city}</strong></div>
                        </div>

                        <div>
                            <div class="font-black text-black mb-1">PARCEL CONTENTS:</div>
                            <ul class="list-disc pl-5 space-y-1">
                                ${o.items.map(i => `<li>${i.title} (Qty: ${i.qty}) - Rs.${i.price}</li>`).join('')}
                            </ul>
                        </div>

                        <div class="bg-brand-yellow p-4 rounded-xl text-black font-black text-sm flex justify-between">
                            <span>COLLECT CASH ON DELIVERY (COD):</span>
                            <span>Rs.${o.total.toLocaleString()} PKR</span>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="window.print();" class="flex-1 bg-black text-white py-3 rounded-xl font-black text-xs uppercase">Print Slip</button>
                        <button onclick="state.viewingOrderDetails=null; render();" class="flex-1 bg-gray-200 text-black py-3 rounded-xl font-black text-xs uppercase">Close</button>
                    </div>
                </div>
            </div>
            `;
        }

        // MAIN APPLICATION RENDER ENGINE
        function render() {
            const app = document.getElementById('app');
            
            if (state.view === 'checkout') {
                app.innerHTML = renderCheckout() + renderOrderReceiptModal() + renderAdminLoginModal();
                return;
            }

            if (state.view === 'admin') {
                if (!state.adminLoggedIn) {
                    state.view = 'storefront';
                    state.adminModalOpen = true;
                    render();
                    return;
                }
                app.innerHTML = renderAdminDashboard() + renderOrderSlipModal();
                return;
            }

            // Storefront Main Layout
            app.innerHTML = `
                ${renderTicker()}
                ${renderHeader()}
                ${renderHero()}
                ${renderBestSeller()}
                ${renderCatalog()}
                ${renderWhyChooseUs()}
                ${renderSocialProof()}
                ${renderFAQ()}
                ${renderContactAndFooter()}
                ${renderCartDrawer()}
                ${renderOrderReceiptModal()}
                ${renderAdminLoginModal()}
            `;
        }

        // Initialize App on Window Load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
